<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports – Precise Procure</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/premium-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .rp-toolbar { display:flex; flex-wrap:wrap; gap:0.6rem; align-items:center; margin-bottom:1.25rem; }
        .rp-presets { display:inline-flex; gap:0.25rem; padding:0.25rem; border-radius:0.75rem; background:rgba(255,255,255,0.85); border:1px solid var(--border-light); }
        .rp-presets button { border:0; background:transparent; font:inherit; font-size:0.82rem; font-weight:600; color:var(--text-secondary); padding:0.4rem 0.8rem; border-radius:0.55rem; cursor:pointer; }
        .rp-presets button:hover { background:rgba(15,23,42,0.05); }
        .rp-presets button.active { background:var(--primary); color:#fff; }
        .rp-dates { display:inline-flex; gap:0.4rem; align-items:center; font-size:0.82rem; color:var(--text-secondary); }
        .rp-dates input { font:inherit; font-size:0.82rem; padding:0.4rem 0.5rem; border:1px solid var(--border); border-radius:0.5rem; background:#fff; }
        .rp-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:0.9rem; margin-bottom:1.25rem; }
        .rp-kpi { background:rgba(255,255,255,0.92); border:1px solid var(--border-light); border-radius:1rem; padding:1rem 1.1rem; box-shadow:0 2px 10px rgba(15,23,42,0.04); }
        .rp-kpi .label { font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-secondary); }
        .rp-kpi .value { font-size:1.7rem; font-weight:800; margin-top:0.2rem; line-height:1.15; }
        .rp-kpi .note { font-size:0.75rem; color:var(--text-secondary); margin-top:0.2rem; }
        .rp-grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); margin-bottom:1rem; }
        .rp-card { background:rgba(255,255,255,0.92); border:1px solid var(--border-light); border-radius:1rem; padding:1.1rem 1.25rem; box-shadow:0 2px 10px rgba(15,23,42,0.04); min-width:0; }
        .rp-card h3 { font-size:0.95rem; margin:0 0 0.15rem; }
        .rp-card .sub { font-size:0.78rem; color:var(--text-secondary); margin:0 0 0.9rem; }
        .rp-card.wide { grid-column:1 / -1; }
        .rp-tabs { display:inline-flex; gap:0.2rem; float:right; }
        .rp-tabs button { border:1px solid var(--border); background:#fff; font:inherit; font-size:0.74rem; font-weight:600; color:var(--text-secondary); padding:0.25rem 0.6rem; border-radius:0.5rem; cursor:pointer; }
        .rp-tabs button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        .rp-chart { max-width:100%; height:auto; display:block; }
        .rp-chart .bar { fill:var(--primary); }
        .rp-chart .bar:hover { fill:var(--primary-dark, #14578a); }
        .rp-chart .axis { stroke:var(--border); stroke-width:1; }
        .rp-chart text { font-size:11px; fill:#475569; font-family:inherit; }
        .rp-funnel-row { display:grid; grid-template-columns:9.5rem 1fr 6.5rem; gap:0.7rem; align-items:center; margin-bottom:0.55rem; font-size:0.85rem; }
        .rp-funnel-row .track { height:1.35rem; background:#eef2f7; border-radius:0.5rem; overflow:hidden; }
        .rp-funnel-row .fill { height:100%; background:linear-gradient(90deg,#3b9fd9,#1b72b3); border-radius:0.5rem; min-width:2px; }
        .rp-funnel-row .num { text-align:right; font-weight:700; }
        .rp-funnel-row .num small { color:var(--text-secondary); font-weight:500; }
        .rp-steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:0.7rem; }
        .rp-step { padding:0.75rem 0.85rem; border-radius:0.8rem; background:#f1f5f9; }
        .rp-step .t { font-size:0.74rem; font-weight:600; color:var(--text-secondary); }
        .rp-step .v { font-size:1.25rem; font-weight:800; margin-top:0.1rem; }
        .rp-step .m { font-size:0.72rem; color:var(--text-secondary); }
        .rp-table { width:100%; border-collapse:collapse; font-size:0.84rem; }
        .rp-table th { text-align:left; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-secondary); padding:0.35rem 0.4rem; }
        .rp-table td { padding:0.5rem 0.4rem; border-top:1px solid var(--border-light); }
        .rp-table td.n, .rp-table th.n { text-align:right; white-space:nowrap; }
        .rp-table .name { font-weight:600; max-width:15rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .rp-meter { display:inline-block; width:3.5rem; height:0.5rem; background:#e2e8f0; border-radius:99px; overflow:hidden; vertical-align:middle; margin-right:0.35rem; }
        .rp-meter i { display:block; height:100%; background:var(--success); }
        .rp-empty { text-align:center; color:var(--text-secondary); padding:1.5rem 0.5rem; font-size:0.85rem; }
        .rp-banner { padding:0.7rem 1rem; border-radius:0.8rem; background:#fffbeb; color:#92400e; border:1px solid #fde68a; font-size:0.85rem; margin-bottom:1rem; }
    </style></head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="flex items-center gap-2 logo-text">
                    <i class="ph ph-gauge" style="font-size:1.5rem;color:var(--primary)"></i>
                    <span>Precise Procure</span>
                </div>
                <button class="toggle-btn" onclick="toggleSidebar()"><i class="ph ph-list"></i></button>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin.html" class="nav-item">
                    <i class="ph ph-house"></i>
                    <span>Dashboard</span>
                </a>
                <div style="height: 1px; background: var(--border); margin: 0.5rem 0;"></div>
                <div class="menu-label" style="padding: 0 1rem; margin-bottom: 0.5rem; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Master Data</div>
                <a href="/masters.html?type=materials" class="nav-item">
                    <i class="ph ph-package"></i>
                    <span>Materials</span>
                </a>
                <a href="/masters.html?type=employees" class="nav-item">
                    <i class="ph ph-users"></i>
                    <span>Employees</span>
                </a>
                <a href="/masters.html?type=customers" class="nav-item">
                    <i class="ph ph-user-circle"></i>
                    <span>Customers</span>
                </a>
                <a href="/masters.html?type=vendors" class="nav-item">
                    <i class="ph ph-storefront"></i>
                    <span>Vendors</span>
                </a>
                <div style="height: 1px; background: var(--border); margin: 0.5rem 0;"></div>
                <div class="menu-label" style="padding: 0 1rem; margin-bottom: 0.5rem; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Enquiry Management</div>
                <a href="/sales.html" class="nav-item">
                    <i class="ph ph-shopping-cart-simple"></i>
                    <span>Sales &amp; Enquiries</span>
                </a>
                <a href="/sourcing.html" class="nav-item">
                    <i class="ph ph-package"></i>
                    <span>Sourcing / Purchase</span>
                </a>
                <a href="/key-accounts.html" class="nav-item">
                    <i class="ph ph-handshake"></i>
                    <span>Key Accounts</span>
                </a>
                <div style="height: 1px; background: var(--border); margin: 0.5rem 0;"></div>
                <div class="menu-label" style="padding: 0 1rem; margin-bottom: 0.5rem; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Access Control</div>
                <a href="/role-management.html" class="nav-item">
                    <i class="ph ph-shield-check"></i>
                    <span>Roles &amp; Access</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div style="width:32px;height:32px;background:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;flex-shrink:0">
                        <i class="ph ph-user"></i>
                    </div>
                    <div class="user-info" style="flex:1;overflow:hidden">
                        <div style="font-weight:600;font-size:0.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="navUserName">Admin</div>
                        <div style="font-size:0.75rem;color:var(--text-secondary)" id="navUserRole">Administrator</div>
                    </div>
                    <button onclick="logout()" class="toggle-btn" title="Logout"><i class="ph ph-sign-out"></i></button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header mb-4" style="background:transparent;border:none;padding:0;box-shadow:none">
                <div class="flex-between" style="flex-wrap:wrap;gap:1rem">
                    <div>
                        <h1 style="font-size:1.75rem;display:flex;align-items:center;gap:0.6rem">
                            <i class="ph ph-chart-line-up" style="color:var(--primary)"></i>
                            Reports
                        </h1>
                        <p class="text-muted" id="greetingSubtitle">How the business is doing, from the enquiries raised in the period you choose.</p>
                    </div>
                    <button class="btn btn-secondary" id="downloadBtn" type="button"><i class="ph ph-download-simple"></i> Download</button>
                </div>
            </div>

            <div class="rp-toolbar">
                <div class="rp-presets" role="group" aria-label="Period">
                    <button type="button" data-days="7">7 days</button>
                    <button type="button" data-days="30" class="active">30 days</button>
                    <button type="button" data-days="90">90 days</button>
                    <button type="button" data-days="365">1 year</button>
                </div>
                <div class="rp-dates">
                    <label for="fromDate">From</label><input type="date" id="fromDate">
                    <label for="toDate">to</label><input type="date" id="toDate">
                </div>
                <span id="rangeNote" class="text-muted" style="font-size:0.8rem"></span>
            </div>

            <div id="reportBody" data-skeleton="4"></div>
        </main>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/analytics.js"></script>
</body>
</html>
